<style>
:root {
  --bg-1: #14161b;
  --bg-2: #1c1f27;
  --bg-3: #171920;
  --orb-sand: rgba(218, 192, 150, 0.18);
  --orb-sand-2: rgba(196, 166, 118, 0.14);
  --orb-graphite: rgba(78, 85, 102, 0.22);

  --glass-bg: linear-gradient(155deg, rgba(48, 52, 62, 0.56) 0%, rgba(27, 30, 38, 0.46) 100%);
  --glass-bg-strong: linear-gradient(155deg, rgba(42, 46, 56, 0.88) 0%, rgba(24, 27, 34, 0.85) 100%);
  --glass-cell: rgba(255, 248, 236, 0.028);
  --glass-border: rgba(236, 218, 188, 0.24);
  --glass-border-soft: rgba(236, 218, 188, 0.12);
  --glass-shadow:
    inset 0 0 26px rgba(244, 228, 200, 0.12),
    inset 0 1px 0 rgba(255, 250, 240, 0.28),
    0 14px 36px rgba(0, 0, 0, 0.34);
  --glass-shadow-sm:
    inset 0 0 15px rgba(244, 228, 200, 0.10),
    inset 0 1px 0 rgba(255, 250, 240, 0.22),
    0 6px 18px rgba(0, 0, 0, 0.24);

  --sand: #dac096;
  --sand-bright: #ead6b3;
  --sand-deep: #bfa06e;
  --sand-ink: #17191f;
  --sand-tint: rgba(218, 192, 150, 0.13);
  --sand-tint-strong: rgba(218, 192, 150, 0.22);

  --text: #f4f0e8;
  --muted: #aca69c;
  --subtle: #78746d;
  --input-bg: rgba(18, 20, 26, 0.68);

  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

:root[data-theme="light"] {
  --bg-1: #ebe3d5;
  --bg-2: #e2d7c5;
  --bg-3: #d9ccb8;
  --orb-sand: rgba(182, 146, 92, 0.20);
  --orb-sand-2: rgba(255, 252, 245, 0.58);
  --orb-graphite: rgba(45, 50, 62, 0.10);

  --glass-bg: linear-gradient(155deg, rgba(255, 252, 246, 0.66) 0%, rgba(246, 239, 228, 0.50) 100%);
  --glass-bg-strong: linear-gradient(155deg, rgba(252, 248, 241, 0.93) 0%, rgba(240, 232, 219, 0.91) 100%);
  --glass-cell: rgba(255, 255, 255, 0.26);
  --glass-border: rgba(60, 52, 40, 0.16);
  --glass-border-soft: rgba(60, 52, 40, 0.10);
  --glass-shadow:
    inset 0 0 28px rgba(255, 255, 255, 0.70),
    inset 0 1px 0 rgba(255, 255, 255, 0.86),
    0 12px 30px rgba(34, 30, 24, 0.10);
  --glass-shadow-sm:
    inset 0 0 16px rgba(255, 255, 255, 0.62),
    inset 0 1px 0 rgba(255, 255, 255, 0.80),
    0 4px 14px rgba(34, 30, 24, 0.08);

  --sand: #7a5c32;
  --sand-bright: #5e4522;
  --sand-deep: #8f6e3f;
  --sand-ink: #fbf8f3;
  --sand-tint: rgba(138, 106, 60, 0.12);
  --sand-tint-strong: rgba(138, 106, 60, 0.20);

  --text: #1c1f26;
  --muted: #57534c;
  --subtle: #878075;
  --input-bg: rgba(255, 252, 247, 0.75);
}

*, *::before, *::after { box-sizing: border-box; }
html {
  scroll-behavior: smooth;
  scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 16px);
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background-color: var(--bg-1);
  background-image:
    radial-gradient(ellipse 80% 50% at 16% 6%, var(--orb-sand) 0%, transparent 68%),
    radial-gradient(ellipse 65% 48% at 88% 44%, var(--orb-graphite) 0%, transparent 68%),
    radial-gradient(ellipse 80% 55% at 24% 94%, var(--orb-sand-2) 0%, transparent 70%),
    linear-gradient(165deg, var(--bg-1) 0%, var(--bg-2) 50%, var(--bg-3) 100%);
  background-attachment: fixed;
  padding: 16px 14px 44px;
  position: relative;
  overflow-x: hidden;
}

.ambient {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(64px);
}
.orb.o1 { width: 380px; height: 380px; top: -90px; left: -70px; background: var(--orb-sand); }
.orb.o2 { width: 340px; height: 340px; top: 38%; right: -90px; background: var(--orb-sand-2); }
.orb.o3 { width: 420px; height: 320px; bottom: -80px; left: 18%; background: var(--orb-graphite); }

.wrap {
  position: relative;
  z-index: 1;
  max-width: 1260px;
  margin: 0 auto;
}

.glass {
  background: var(--glass-bg);
  backdrop-filter: blur(22px) saturate(140%);
  -webkit-backdrop-filter: blur(22px) saturate(140%);
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-shadow);
  border-radius: 20px;
}

.ico {
  width: 14px;
  height: 14px;
  flex: 0 0 14px;
  vertical-align: -2px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.9;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.ico-sm {
  width: 13px;
  height: 13px;
  flex: 0 0 13px;
  vertical-align: -2px;
}

button {
  font: inherit;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text);
  background: var(--glass-bg);
  backdrop-filter: blur(16px) saturate(135%);
  -webkit-backdrop-filter: blur(16px) saturate(135%);
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-shadow-sm);
  padding: 9px 14px;
  border-radius: 13px;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.18s ease, background 0.18s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  user-select: none;
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}
button:hover:not(:disabled) {
  border-color: var(--sand);
}
button:active:not(:disabled) {
  transform: scale(0.98);
}
button:disabled {
  opacity: 0.38;
  cursor: default;
}
button.sand-btn {
  background: linear-gradient(145deg, var(--sand-bright), var(--sand));
  color: var(--sand-ink);
  border-color: transparent;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.35);
}

/* Верхняя панель */
.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.top-grp {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Шапка недели */
.hero {
  text-align: center;
  margin: 14px auto 18px;
  padding: 20px 18px 18px;
  max-width: 680px;
}
.group-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  background: var(--sand-tint);
  color: var(--sand-bright);
  border: 1px solid var(--glass-border);
}
.hero-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  margin: 10px 0 6px;
}
.hero .num {
  font-size: clamp(58px, 13vw, 92px);
  font-weight: 800;
  line-height: 0.92;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
  background: linear-gradient(180deg, var(--sand-bright) 0%, var(--sand) 65%, var(--sand-deep) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.hero-meta {
  text-align: left;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 5px;
}
.hero-meta small {
  display: block;
  color: var(--muted);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-size: 11.5px;
  font-weight: 700;
}
.parity-badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 8px;
  font-size: 12.5px;
  font-weight: 700;
  background: var(--sand-tint-strong);
  color: var(--sand-bright);
  border: 1px solid var(--glass-border);
}
.hero .lbl {
  font-size: clamp(17px, 2.8vw, 22px);
  font-weight: 700;
  margin-top: 4px;
}
.hero .sub {
  color: var(--muted);
  margin-top: 5px;
  font-size: 13px;
}

/* Панель управления неделей и режимом */
.toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.nav {
  display: flex;
  gap: 8px;
  align-items: center;
}
.mode-switch {
  display: inline-flex;
  padding: 3px;
  border-radius: 13px;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-shadow-sm);
}
.mode-switch button {
  border: 0;
  background: transparent;
  box-shadow: none;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  padding: 6px 12px;
  border-radius: 10px;
  font-size: 12.5px;
  color: var(--muted);
}
.mode-switch button.on {
  background: linear-gradient(145deg, var(--sand-bright), var(--sand));
  color: var(--sand-ink);
  font-weight: 700;
}

/* Быстрый переход по дням на телефонах */
.day-chips {
  display: none;
  gap: 6px;
  margin-bottom: 12px;
  overflow-x: auto;
  padding-bottom: 2px;
  scrollbar-width: none;
}
.day-chips::-webkit-scrollbar { display: none; }
.day-chips button {
  flex: 1 1 0;
  min-width: 56px;
  flex-direction: column;
  gap: 2px;
  padding: 7px 6px;
  border-radius: 12px;
  font-size: 12.5px;
}
.day-chips button span {
  font-size: 11px;
  font-weight: 500;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.day-chips button.today {
  border-color: var(--sand);
  background: var(--sand-tint-strong);
}
.day-chips button.today b { color: var(--sand-bright); }

/* Десктопная таблица в матовом стекле */
.scroll {
  overflow-x: auto;
  overflow-y: hidden;
}
table.sched {
  border-collapse: collapse;
  width: 100%;
  min-width: 980px;
  table-layout: fixed;
}
table.sched th, table.sched td {
  border-right: 1px solid var(--glass-border-soft);
  border-bottom: 1px solid var(--glass-border-soft);
  padding: 11px 11px;
  vertical-align: top;
  font-size: 13px;
}
table.sched th:last-child, table.sched td:last-child { border-right: 0; }
table.sched tbody tr:last-child td { border-bottom: 0; }

table.sched th {
  background: rgba(255, 250, 240, 0.04);
  font-size: 14px;
  font-weight: 700;
  text-align: left;
  padding: 12px 11px;
}
table.sched th .th-top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 6px;
}
table.sched th .th-date {
  font-weight: 500;
  font-size: 12px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
table.sched th.today {
  background: linear-gradient(145deg, rgba(218, 192, 150, 0.28), rgba(218, 192, 150, 0.14));
  color: var(--sand-bright);
  box-shadow: inset 0 -2px 0 var(--sand);
}
table.sched th.today .th-date { color: var(--sand-bright); opacity: 0.9; }
table.sched td.today {
  background: var(--sand-tint);
}
table.sched th.n, table.sched td.n {
  width: 48px;
  text-align: center;
  font-weight: 800;
  color: var(--sand);
  vertical-align: middle;
  font-variant-numeric: tabular-nums;
  background: rgba(0, 0, 0, 0.08);
}

/* Элемент пары */
.les {
  margin-bottom: 10px;
  padding-bottom: 10px;
  border-bottom: 1px dashed var(--glass-border-soft);
}
.les:last-child {
  margin-bottom: 0;
  padding-bottom: 0;
  border-bottom: 0;
}
.les-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  margin-bottom: 6px;
  flex-wrap: wrap;
}
.les-time {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11.5px;
  font-weight: 700;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.badge {
  display: inline-block;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  padding: 2px 7px;
  border-radius: 6px;
  border: 1px solid var(--glass-border);
}
.badge.lec {
  background: var(--sand-tint-strong);
  color: var(--sand-bright);
  border-color: rgba(218, 192, 150, 0.42);
}
.badge.clin {
  background: rgba(244, 240, 232, 0.09);
  color: var(--text);
}
.badge.prac {
  background: rgba(172, 166, 156, 0.12);
  color: var(--muted);
}

.les-title {
  display: block;
  font-size: 14px;
  font-weight: 700;
  line-height: 1.32;
  margin-bottom: 6px;
  color: var(--text);
}
.les-row {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  line-height: 1.35;
}
.les-row .ico-sm {
  margin-top: 2px;
}
.les-loc {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--sand);
  margin-bottom: 3px;
}
.les-prof {
  font-size: 12px;
  color: var(--muted);
}
.les-dates {
  margin-top: 6px;
  font-size: 11px;
  color: var(--subtle);
  line-height: 1.35;
  padding: 4px 7px;
  border-radius: 7px;
  background: rgba(0, 0, 0, 0.14);
}
:root[data-theme="light"] .les-dates {
  background: rgba(60, 50, 35, 0.06);
}

.empty {
  color: var(--subtle);
  text-align: center;
  padding: 10px 0;
  font-size: 13px;
}
td.off, .dc.off {
  opacity: 0.52;
}

/* Подсветка текущей и следующей пары */
td.now, .cp.now {
  background: var(--sand-tint-strong) !important;
  box-shadow: inset 0 0 0 1.5px var(--sand), inset 0 0 22px rgba(218, 192, 150, 0.16);
}
td.next, .cp.next {
  box-shadow: inset 0 0 0 1px var(--sand);
}
td.now::before, td.next::before, .cp.now::before, .cp.next::before {
  content: attr(data-b);
  display: inline-block;
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 2px 8px;
  border-radius: 999px;
  margin-bottom: 7px;
}
td.now::before, .cp.now::before {
  background: linear-gradient(145deg, var(--sand-bright), var(--sand));
  color: var(--sand-ink);
}
td.next::before, .cp.next::before {
  background: var(--sand-tint-strong);
  color: var(--sand-bright);
  border: 1px solid var(--glass-border);
}

/* Мобильные стеклянные карточки дней */
#cards { display: none; }
.dc {
  padding: 15px 15px 13px;
  margin-bottom: 13px;
}
.dc.today {
  border-color: var(--sand);
  box-shadow:
    inset 0 0 28px rgba(218, 192, 150, 0.18),
    inset 0 1px 0 rgba(255, 250, 240, 0.34),
    0 16px 38px rgba(0, 0, 0, 0.38);
}
.dh2 {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--glass-border-soft);
}
.dh2 b {
  font-size: 17px;
  letter-spacing: -0.01em;
}
.dh2 span {
  color: var(--muted);
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}
.dc.today .dh2 b {
  color: var(--sand-bright);
}
.cp {
  padding: 11px 11px;
  margin-top: 9px;
  border-radius: 14px;
  background: var(--glass-cell);
  border: 1px solid var(--glass-border-soft);
}
.cp:first-of-type { margin-top: 0; }
.ct {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  font-size: 12.5px;
  color: var(--muted);
  margin-bottom: 7px;
  font-variant-numeric: tabular-nums;
  flex-wrap: wrap;
}
.ct-left {
  display: inline-flex;
  align-items: center;
  gap: 7px;
}
.ct b {
  color: var(--sand-bright);
  font-size: 13px;
}

.nav-bottom {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-top: 18px;
  flex-wrap: wrap;
}

/* Праздничные дни */
td.hol {
  text-align: center;
  vertical-align: middle;
  background: var(--sand-tint);
}
.hb {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 16px 8px;
}
.hb .hi {
  width: 36px;
  height: 36px;
  border-radius: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--sand-tint-strong);
  border: 1px solid var(--glass-border);
  color: var(--sand-bright);
  margin-bottom: 2px;
}
.hb b {
  font-size: 14.5px;
  color: var(--sand-bright);
}
.seeb {
  margin-top: 6px;
  font-size: 12.5px;
  padding: 7px 12px;
}

/* Модальные окна */
dialog {
  border: 1px solid var(--glass-border);
  border-radius: 22px;
  background: var(--glass-bg-strong);
  backdrop-filter: blur(26px) saturate(145%);
  -webkit-backdrop-filter: blur(26px) saturate(145%);
  box-shadow: var(--glass-shadow);
  color: var(--text);
  padding: 18px;
  width: min(620px, 94vw);
  max-height: 88vh;
  overflow: auto;
}
dialog::backdrop {
  background: rgba(8, 10, 14, 0.62);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}
.dh {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--glass-border-soft);
  font-size: 16.5px;
}
.dh b {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.tabs {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
.tabs button {
  padding: 6px 12px;
  font-size: 12.5px;
  border-radius: 10px;
}
.tabs button.on {
  background: linear-gradient(145deg, var(--sand-bright), var(--sand));
  color: var(--sand-ink);
  border-color: transparent;
}

/* Таблица звонков */
.bt {
  width: 100%;
  border-collapse: collapse;
  margin-bottom: 14px;
  font-variant-numeric: tabular-nums;
}
.bt th, .bt td {
  border-bottom: 1px solid var(--glass-border-soft);
  padding: 8px 8px;
  text-align: left;
  font-size: 13px;
}
.bt th {
  color: var(--muted);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.bt tr.long td {
  background: var(--sand-tint);
}
.bt tr.cur td {
  background: var(--sand-tint-strong);
  color: var(--sand-bright);
  font-weight: 700;
}
.bh {
  margin: 10px 0 6px;
  font-weight: 700;
  color: var(--sand-bright);
  font-size: 14px;
}

/* Справочник корпусов */
.bld-item {
  padding: 11px 12px;
  border-radius: 14px;
  border: 1px solid var(--glass-border-soft);
  background: var(--glass-cell);
  margin-bottom: 8px;
}
.bld-addr {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-weight: 700;
  color: var(--sand-bright);
  font-size: 14px;
}
.bld-sub {
  font-size: 12.5px;

let now = new Date(), dow, effDay, realWeek, todayIdx, inRange;
function calcNow() {
  now = new Date();
  dow = (now.getDay() + 6) % 7;
  effDay = utc(now) + (dow >= 5 ? (7 - dow) * DAY : 0);
  realWeek = Math.floor((effDay - mon1) / DAY / 7) + 1;
  todayIdx = dow;
  inRange = utc(now) >= START && utc(now) <= END;
}

const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function lessonsForDate(pair, day, dayT) {
  const dIso = iso(dayT);
  if (OV[dIso]) {
    return (OV[dIso][pair] || []).map(x => ({
      pair, day,
      title: x[0],
      type: x[1] || "prac",
      time: x[2] || "",
      loc: x[3] || "",
      prof: x[4] || ""
    }));
  }
  const out = [];
  for (const it of SCHEDULE) {
    if (it.pair !== pair || it.day !== day) continue;
    if (it.dates) {
      for (const blk of it.dates) {
        if (blk.d.includes(dIso)) {
          out.push({
            pair, day,
            type: it.type,
            time: it.time,
            title: it.title,
            loc: it.loc,
            prof: blk.prof
          });
        }
      }
    } else if (dIso >= it.from && dIso <= it.to) {
      out.push({
        pair, day,
        type: it.type,
        time: it.time,
        title: it.title,
        loc: it.loc,
        prof: it.prof
      });
    }
  }
  return out;
}

function lessonsForSemester(pair, day) {
  return SCHEDULE.filter(it => it.pair === pair && it.day === day).map(it => {
    const profSummary = it.dates
      ? it.dates.map(b => b.prof).join(" · ")
      : it.prof;
    return {
      pair, day,
      type: it.type,
      time: it.time,
      title: it.title,
      loc: it.loc,
      prof: profSummary,
      semNote: it.semNote,
      parity: it.parity
    };
  });
}

function maxPairForWeek(start) {
  let mp = 3;
  for (let d = 0; d < 5; d++) {
    const ov = OV[iso(start + d * DAY)];
    if (ov && ov[4] && ov[4].length) mp = 4;
  }
  return mp;
}

function hasLessons(d, dayT) {
  return [1, 2, 3, 4].some(p => lessonsForDate(p, d, dayT).length > 0);
}

const gk = i => i === 0 ? "mon" : i === 3 ? "thu" : "vsp";

function curPair() {
  if (viewMode !== "week" || !(inRange && week === realWeek) || todayIdx > 4 || HOL[iso(utc(now))]) return null;
  const m = now.getHours() * 60 + now.getMinutes(), t = utc(now);
  let nx = null;
  for (const r of G[gk(todayIdx)].rows) {
    if (!/^\d$/.test(r[0])) continue;
    const [a, b] = r[1].split("–"), p = +r[0];
    const startM = mins(a), endM = mins(b);
    if (!lessonsForDate(p, todayIdx, t).length) continue;
    if (m >= startM && m < endM) {
      const rem = endM - m;
      return { p, s: "now", label: `сейчас идёт · до ${b} (${rem} мин)` };
    }
    if (m < startM && !nx) {
      const diff = startM - m;
      const waitTxt = diff <= 90 ? ` (через ${diff} мин)` : "";
      nx = { p, s: "next", label: `следующая · в ${a}${waitTxt}` };
    }
  }
  return nx;
}

    `<button data-a="badd" data-g="${k}">+ Строка</button></div>`).join("") +
    `<div class="ar"><button class="sand-btn" data-a="savebells">Сохранить звонки</button><button data-a="resetbells">Стандартные</button></div>
     <div class="hint">Формат времени: 08:50–10:25. Строки с цифрой (1, 2, 3) в первом поле используются для автоматической обводки текущей пары.</div>`;
}
function dataHtml() {
  return `<div class="hint" style="margin-bottom:8px">Все правки хранятся локально на вашем устройстве. Вы можете скопировать JSON-код и отправить одногруппникам, чтобы они вставили его у себя и нажали «Загрузить».</div>
    <textarea id="ajson" rows="7">${esc(JSON.stringify({ bells: G, ov: OV }))}</textarea>
    <div class="ar">
      <button class="sand-btn" data-a="import">Загрузить JSON</button>
      <button data-a="newpin">Сменить PIN</button>
      <button data-a="resetall">Сбросить все правки</button>
    </div>`;
}
function drawAdmin() {
  if (!isAdm) {
    ac.innerHTML = `<div class="hint">${store.get("pin") ? "Введите PIN-код администратора" : "Придумайте PIN-код для локального редактирования расписания на этом устройстве"}</div>
      <div class="ar"><input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="PIN"><button class="sand-btn" data-a="pin">Войти</button></div>
      <div class="am">${esc(amsg)}</div>`;
    return;
  }
  const tabs = [["day", "Пары на день"], ["bells", "Звонки"], ["data", "Экспорт / Сброс"]]
    .map(([k, n]) => `<button data-a="tab" data-k="${k}" class="${atab === k ? "on" : ""}">${n}</button>`).join("");
  ac.innerHTML = `<div class="tabs">${tabs}</div>${atab === "day" ? dayHtml() : atab === "bells" ? bellsHtml() : dataHtml()}<div class="am">${esc(amsg)}</div>`;
}
function collect() {
  if (atab === "day") {
    const e = { 1: [], 2: [], 3: [], 4: [] };
    ac.querySelectorAll(".lr").forEach(r => {
      const inp = r.querySelectorAll("input");
      const sel = r.querySelector("select");
      e[r.dataset.p].push([inp[0].value.trim(), sel.value, inp[1].value.trim(), inp[2].value.trim(), inp[3].value.trim()]);
    });
    edit = e;
  } else if (atab === "bells") {
    const e = { mon: [], vsp: [], thu: [] };
    ac.querySelectorAll(".br").forEach(r => {
      const i = r.querySelectorAll("input");
      const row = [i[0].value.trim(), i[1].value.trim(), i[2].value.trim()];
      if (i[3].checked) row.push(1);
      e[r.dataset.g].push(row);
    });
    bedit = e;
  }
}
function enter() { isAdm = true; aiso = defaultIso(); loadDay(); }

ac.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b || !b.dataset.a) return;
  const a = b.dataset.a;
  amsg = "";
  if (isAdm && a !== "resetall" && a !== "import") collect();

  if (a === "pin") {
    const v = document.getElementById("pin").value;
    if (!v) amsg = "Введите PIN";
    else if (!store.get("pin")) { if (store.set("pin", hsh(v))) enter(); else amsg = "Не удалось сохранить PIN"; }
    else if (hsh(v) === store.get("pin")) enter();
    else amsg = "Неверный PIN";
  } else if (a === "tab") {
    atab = b.dataset.k;
    if (atab === "day") loadDay();
    if (atab === "bells") bedit = { mon: cp0(G.mon.rows), vsp: cp0(G.vsp.rows), thu: cp0(G.thu.rows) };
  } else if (a === "add") {
    edit[b.dataset.p].push(["", "prac", "", "", ""]);
  } else if (a === "del") {
    edit[b.dataset.p].splice(+b.dataset.i, 1);
  } else if (a === "saveday") {
    const o = {};
    for (let p = 1; p <= 4; p++) o[p] = edit[p].filter(x => x[0]);
    OV[aiso] = o;
    amsg = store.set("ov", OV) ? "Изменения на " + aiso + " сохранены" : "Ошибка сохранения";
    render();
  } else if (a === "resetday") {
    delete OV[aiso];
    store.set("ov", OV);
    loadDay();
    amsg = "Возвращено официальное расписание на этот день";
    render();
  } else if (a === "badd") {
    bedit[b.dataset.g].push(["", "", ""]);
  } else if (a === "bdel") {
    bedit[b.dataset.g].splice(+b.dataset.i, 1);
  } else if (a === "savebells") {
    for (const k in bedit) {
      for (const r of bedit[k]) {
        if (!r[0] && !r[1]) continue;
        r[1] = r[1].replace(/\s/g, "").replace(/[-—]/, "–");
        if (!/^\d{1,2}:\d{2}–\d{1,2}:\d{2}$/.test(r[1])) { amsg = "Проверьте формат времени (ЧЧ:ММ–ЧЧ:ММ) в строке «" + r[0] + "»"; break; }
      }
    }
    if (!amsg) {
      for (const k in bedit) G[k].rows = bedit[k].filter(r => r[0] && r[1]);
      amsg = store.set("bells", G) ? "Расписание звонков сохранено" : "Ошибка сохранения";
      render();
    }
  } else if (a === "resetbells") {
    ["mon", "vsp", "thu"].forEach(k => G[k].rows = cp0(G0[k].rows));
    store.del("bells");
    bedit = { mon: cp0(G.mon.rows), vsp: cp0(G.vsp.rows), thu: cp0(G.thu.rows) };
    amsg = "Восстановлены стандартные звонки";
    render();
  } else if (a === "import") {
    try {
      const j = JSON.parse(document.getElementById("ajson").value);
      if (j.bells) {
        for (const k of ["mon", "vsp", "thu"]) if (!j.bells[k] || !Array.isArray(j.bells[k].rows)) throw 0;
        Object.assign(G, j.bells);
        store.set("bells", G);
      }
      if (j.ov && typeof j.ov === "object") { OV = j.ov; store.set("ov", OV); }
      amsg = "Данные успешно загружены";
      render();
    } catch (x) { amsg = "Неверный формат JSON"; }
  } else if (a === "newpin") {
    store.del("pin");
    isAdm = false;
  } else if (a === "resetall") {
    if (!b.dataset.c) { b.dataset.c = 1; b.textContent = "Нажмите ещё раз для подтверждения"; return; }
    ["mon", "vsp", "thu"].forEach(k => G[k].rows = cp0(G0[k].rows));
    OV = {};
    store.del("bells");
    store.del("ov");
    amsg = "Все пользовательские правки сброшены";
    render();
  }
  drawAdmin();
});

ac.addEventListener("change", e => {
  if (e.target.id === "ad") {
    aiso = e.target.value;
    amsg = "";
    loadDay();
    drawAdmin();
  }
});
document.getElementById("admbtn").onclick = () => { amsg = ""; isAdm = false; drawAdmin(); dlgA.showModal(); };
document.getElementById("xa").onclick = () => dlgA.close();
dlgA.addEventListener("click", e => { if (e.target === dlgA) dlgA.close(); });
dlgA.addEventListener("close", () => { isAdm = false; });

render();
</script>
</body>
</html>
